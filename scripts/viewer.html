<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .stats {
    font-size: 13px;
    color: #666;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .stats span { color: #c9a96e; }

  .card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    overflow: hidden;
  }

  .image-wrap {
    width: 100%;
    aspect-ratio: 1;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .info {
    padding: 20px;
  }

  .product-id {
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
    font-family: monospace;
  }

  .product-name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .product-meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 4px;
  }
  .product-meta strong { color: #c9a96e; }

  .buttons {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #222;
  }

  button {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:active { transform: scale(0.97); }

  .btn-copy-img {
    background: #c9a96e;
    color: #0a0a0a;
  }
  .btn-copy-img:hover { background: #d4b87d; }

  .btn-copy-details {
    background: #2563eb;
    color: #fff;
  }
  .btn-copy-details:hover { background: #3b82f6; }

  .btn-skip {
    background: #333;
    color: #999;
  }
  .btn-skip:hover { background: #444; color: #ccc; }

  .btn-done {
    background: #16a34a;
    color: #fff;
  }
  .btn-done:hover { background: #22c55e; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .done-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .done-screen h2 { color: #c9a96e; margin-bottom: 12px; }
  .done-screen p { color: #666; margin-bottom: 20px; }
  .btn-reset {
    background: #333;
    color: #ccc;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-reset:hover { background: #444; }

  .btn-paste {
    background: #7c3aed;
    color: #fff;
  }
  .btn-paste:hover { background: #8b5cf6; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #333;
  }
  .modal-header h3 { font-size: 15px; color: #fff; }
  .modal-close {
    background: none;
    border: none;
    color: #666;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  .modal-close:hover { color: #fff; }

  .modal-body {
    padding: 16px 20px;
    flex: 1;
    overflow: auto;
  }

  .modal-body textarea {
    width: 100%;
    height: 300px;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    resize: vertical;
  }
  .modal-body textarea:focus { outline: none; border-color: #7c3aed; }

  .modal-footer {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid #333;
  }
  .modal-footer button { flex: 1; }
  .btn-cancel {
    background: #333;
    color: #999;
  }
  .btn-save {
    background: #16a34a;
    color: #fff;
  }
</style>
</head>
<body>

<div class="stats" id="stats"></div>

<div class="card" id="card">
  <div class="image-wrap" id="imageWrap">
    <img id="productImage" src="" alt="">
  </div>
  <div class="info">
    <div class="product-id" id="productId"></div>
    <div class="product-name" id="productName"></div>
    <div class="product-meta" id="productMeta1"></div>
    <div class="product-meta" id="productMeta2"></div>
    <div class="product-meta" id="productMeta3"></div>
  </div>
  <div class="buttons">
    <button class="btn-copy-img" onclick="copyImage()">Copy Image</button>
    <button class="btn-copy-details" onclick="copyDetails()">Copy Details</button>
    <button class="btn-paste" onclick="openPasteModal()">Paste</button>
  </div>
  <div class="buttons">
    <button class="btn-skip" onclick="skipProduct()">Skip</button>
    <button class="btn-done" onclick="doneProduct()">Done</button>
  </div>
</div>

<div class="done-screen" id="doneScreen" style="display:none">
  <h2>All caught up!</h2>
  <p id="doneStats"></p>
  <button class="btn-reset" onclick="resetAll()">Reset & Start Over</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="pasteModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Update Product Details</h3>
      <button class="modal-close" onclick="closePasteModal()">&times;</button>
    </div>
    <div class="modal-body">
      <textarea id="pasteInput" placeholder="Paste updated JSON here..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closePasteModal()">Cancel</button>
      <button class="btn-save" onclick="saveDetails()">Save</button>
    </div>
  </div>
</div>

<script>
let current = null;

async function loadNext() {
  const res = await fetch("/api/next");
  const data = await res.json();

  const stats = data.stats;
  document.getElementById("stats").innerHTML =
    `<span>${stats.done}</span> done · <span>${stats.skipped}</span> skipped · <span>${stats.total - stats.done - stats.skipped}</span> remaining`;

  if (data.done || !data.product) {
    document.getElementById("card").style.display = "none";
    document.getElementById("doneScreen").style.display = "block";
    document.getElementById("doneStats").textContent =
      `${stats.done} done, ${stats.skipped} skipped out of ${stats.total}`;
    return;
  }

  current = data.product;
  const img = data.image;

  document.getElementById("card").style.display = "block";
  document.getElementById("doneScreen").style.display = "none";

  document.getElementById("productId").textContent = current.id;
  document.getElementById("productName").textContent = current.h1 || current.slug;

  const price = current.price ? `${current.currency || "INR"} ${current.price}` : "";
  const mrp = current.mrp ? `MRP ₹${current.mrp}` : "";
  const discount = current.discount ? `${current.discount}% off` : "";
  document.getElementById("productMeta1").innerHTML =
    `<strong>${price}</strong> ${mrp} ${discount}`;

  document.getElementById("productMeta2").textContent =
    [current.brand, current.category_slug, current.sku].filter(Boolean).join(" · ");

  document.getElementById("productMeta3").textContent =
    `Stock: ${current.stock ?? "?"} · ${current.status || ""}`;

  const imgEl = document.getElementById("productImage");
  if (img) {
    const filename = img.localPath.split("/").pop();
    imgEl.src = `/api/image/${current.id}/${filename}`;
    imgEl.alt = img.alt;
  } else {
    imgEl.src = "";
    imgEl.alt = "No image";
  }
}

async function copyImage() {
  if (!current) return;
  try {
    const imgEl = document.getElementById("productImage");
    const canvas = document.createElement("canvas");
    canvas.width = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgEl, 0, 0);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    await navigator.clipboard.write([
      new ClipboardItem({ "image/png": blob })
    ]);
    toast("Image copied");
  } catch (e) {
    toast("Failed to copy image");
  }
}

async function copyDetails() {
  if (!current) return;

  const details = {
    id: current.id,
    slug: current.slug,
    h1: current.h1,
    short_description: current.short_description,
    description: current.description,
    brand: current.brand,
    sku: current.sku,
    category_id: current.category_id,
    category_slug: current.category_slug,
    price: current.price,
    mrp: current.mrp,
    discount: current.discount,
    currency: current.currency,
    stock: current.stock,
    status: current.status,
    is_featured: current.is_featured,
    features: current.features,
    specifications: current.specifications,
    tags: current.tags,
    meta_title: current.meta_title,
    meta_description: current.meta_description,
    faq: current.faq,
    created_at: current.created_at,
    updated_at: current.updated_at,
  };

  try {
    await navigator.clipboard.writeText(JSON.stringify(details, null, 2));
    toast("Details copied");
  } catch (e) {
    toast("Failed to copy");
  }
}

async function skipProduct() {
  if (!current) return;
  await fetch("/api/skip", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: current.id }),
  });
  loadNext();
}

async function doneProduct() {
  if (!current) return;
  await fetch("/api/done", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: current.id }),
  });
  loadNext();
}

async function resetAll() {
  await fetch("/api/reset", { method: "POST" });
  loadNext();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1500);
}

function openPasteModal() {
  document.getElementById("pasteInput").value = JSON.stringify(current, null, 2);
  document.getElementById("pasteModal").classList.add("active");
}

function closePasteModal() {
  document.getElementById("pasteModal").classList.remove("active");
}

async function saveDetails() {
  const raw = document.getElementById("pasteInput").value.trim();
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    toast("Invalid JSON");
    return;
  }

  if (!data.id || data.id !== current.id) {
    toast("JSON id must match current product");
    return;
  }

  const res = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: current.id, data }),
  });

  if (res.ok) {
    toast("Saved");
    closePasteModal();
  } else {
    toast("Failed to save");
  }
}

loadNext();
</script>
</body>
</html>
